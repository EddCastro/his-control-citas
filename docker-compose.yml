# HIS - Control de Citas Medicas
# Un solo comando levanta la base de datos y la aplicacion:
#   docker compose up -d
# (RQNF-01, RQNF-02)

name: his-control-citas

services:
  db:
    image: mysql:8.4
    container_name: his-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-his_citas}
      MYSQL_USER: ${DB_USERNAME:-his}
      MYSQL_PASSWORD: ${DB_PASSWORD:-his_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      TZ: America/Guatemala
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Se ejecuta solo al crear el volumen: crea la base de pruebas.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: his-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-his_citas}
      DB_USERNAME: ${DB_USERNAME:-his}
      DB_PASSWORD: ${DB_PASSWORD:-his_secret}
      COMPOSER_PROCESS_TIMEOUT: 1800
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      # vendor vive en un volumen de Docker: instalar en una carpeta de Windows
      # (por ejemplo OneDrive) es muy lento.
      - vendor:/var/www/html/vendor

volumes:
  mysql_data:
  vendor:
